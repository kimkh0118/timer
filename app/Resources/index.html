<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>타이머</title>
<style>
  :root { --fg:#f5f5f7; --dim:rgba(245,245,247,.55); --line:rgba(255,255,255,.12); --pin:#e0262c; --glass:rgba(255,255,255,.08); }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:transparent; color:var(--fg); font:14px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif; user-select:none; -webkit-user-select:none; overflow:hidden; }
  button { font:inherit; color:inherit; border:0; background:var(--glass); border-radius:10px; cursor:pointer; }
  button:hover { background:rgba(255,255,255,.14); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--pin); outline-offset:2px; }
  .app { height:100%; display:flex; flex-direction:column; align-items:center; padding:38px 22px 20px; gap:18px; }
  .tools { position:fixed; top:8px; right:10px; display:flex; gap:6px; }
  .tool { width:30px; height:30px; display:grid; place-items:center; }
  .tool[aria-pressed="true"] { background:var(--pin); color:#fff; }
  .tool svg { width:16px; height:16px; }
  .ring { position:relative; width:min(78vw,280px); aspect-ratio:1; }
  .ring svg { width:100%; height:100%; transform:rotate(-90deg); }
  .ring circle { fill:none; stroke-width:8; }
  .ring .bg { stroke:var(--line); }
  .ring .bar { stroke:var(--pin); stroke-linecap:round; transition:stroke-dashoffset .3s linear; }
  .time { position:absolute; inset:0; display:grid; place-items:center; font-size:clamp(40px,15vw,64px); font-weight:300; font-variant-numeric:tabular-nums; letter-spacing:-1px; }
  .time.done { color:var(--pin); animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.35; } }
  .presets { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .presets button { padding:7px 12px; }
  .custom { display:flex; align-items:center; gap:6px; color:var(--dim); }
  .custom input { width:56px; padding:6px 8px; border-radius:8px; border:1px solid var(--line); background:var(--glass); color:var(--fg); font:inherit; text-align:center; font-variant-numeric:tabular-nums; }
  .ctrl { display:flex; gap:12px; }
  .ctrl button { padding:12px 26px; font-size:15px; font-weight:600; border-radius:999px; }
  .play { background:var(--pin) !important; color:#fff; min-width:120px; }
  .opts { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:center; color:var(--dim); margin-top:auto; }
  .opts select { background:var(--glass); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:5px 8px; font:inherit; }
  /* 간소화 창 */
  .mini { display:none; height:100%; align-items:center; justify-content:space-between; padding:0 16px; gap:12px; }
  .mini .time { position:static; font-size:44px; }
  .mini-btns { display:flex; gap:6px; }
  body.compact .app { display:none; }
  body.compact .mini { display:flex; }
  body.compact .tools { display:none; }
  .mini-bar { position:fixed; left:0; bottom:0; height:3px; background:var(--pin); transition:width .3s linear; }
</style>
</head>
<body>
<div class="tools">
  <button class="tool" id="pin" title="항상 위에 띄우기" aria-label="항상 위에 띄우기" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M9 3h6l-1 6 4 4H6l4-4z"/></svg>
  </button>
  <button class="tool" id="shrink" title="작게 보기" aria-label="작게 보기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg>
  </button>
</div>

<main class="app">
  <div class="ring">
    <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="45"/><circle class="bar" id="bar" cx="50" cy="50" r="45"/></svg>
    <div class="time" id="time">25:00</div>
  </div>
  <div class="presets" id="presets"></div>
  <label class="custom">직접
    <input id="mm" type="number" min="0" max="999" value="25" aria-label="분">분
    <input id="ss" type="number" min="0" max="59" value="0" aria-label="초">초
  </label>
  <div class="ctrl">
    <button id="reset">초기화</button>
    <button id="play" class="play">시작</button>
  </div>
  <div class="opts">
    <label>알람 <select id="sound"></select></label>
    <label><input type="checkbox" id="loop"> 끌 때까지 울리기</label>
    <label><input type="checkbox" id="tick"> 5초 똑딱</label>
  </div>
</main>

<div class="mini">
  <div class="time" id="miniTime">25:00</div>
  <div class="mini-btns">
    <button class="tool" id="miniPlay" aria-label="시작/일시정지">▶</button>
    <button class="tool" id="miniPin" aria-label="항상 위에 띄우기" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M9 3h6l-1 6 4 4H6l4-4z"/></svg>
    </button>
    <button class="tool" id="grow" aria-label="크게 보기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
    </button>
  </div>
  <i class="mini-bar" id="miniBar"></i>
</div>

<script>
const $ = s => document.querySelector(s);
const send = (type, extra = {}) => { try { window.webkit.messageHandlers.tm.postMessage({ type, ...extra }); } catch (e) {} };
const SOUNDS = ["Glass","Hero","Ping","Purr","Submarine","Funk","Blow","Bottle","Frog","Morse","Pop","Sosumi","Tink","Basso"];
const PRESETS = [1, 5, 10, 15, 25, 30, 50, 60];
const C = 2 * Math.PI * 45;

let saved = {};
try { saved = JSON.parse(localStorage.getItem("timer") || "{}"); } catch (e) {}
const S = Object.assign({ total: 1500, onTop: false, sound: "beep", loop: false, tick: true }, saved);

// ── 소리: 마지막 5초 똑딱(메트로놈), 0초에 삐비비비 ──
let ac = null;
const audio = () => { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); return ac; };
function tone(freq, at, dur, vol, type = "square") {
  const c = audio(), o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, at);
  g.gain.linearRampToValueAtTime(vol, at + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(c.destination);
  o.start(at); o.stop(at + dur + 0.02);
}
function playTick(last) { const t = audio().currentTime; tone(last ? 1600 : 1000, t, 0.05, 0.35, "triangle"); }
let beepTimer = null;
function beepOnce() {   // 삐비비비
  const t = audio().currentTime;
  for (let i = 0; i < 4; i++) tone(2000, t + i * 0.13, 0.09, 0.25);
}
function startBeep(loop) {
  stopBeep(); beepOnce();
  let n = 1;
  beepTimer = setInterval(() => { if (!loop && n >= 3) return stopBeep(); beepOnce(); n++; }, 1000);
}
function stopBeep() { clearInterval(beepTimer); beepTimer = null; }
let lastTickSec = null;
let remaining = S.total * 1000, endAt = null, ticker = null, finished = false;
const save = () => { try { localStorage.setItem("timer", JSON.stringify({ total: S.total, onTop: S.onTop, sound: S.sound, loop: S.loop, tick: S.tick })); } catch (e) {} };

const fmt = ms => {
  const t = Math.ceil(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  const p = n => String(n).padStart(2, "0");
  return h ? `${h}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
};
const running = () => endAt !== null;

function render() {
  const left = running() ? Math.max(0, endAt - Date.now()) : remaining;
  const txt = fmt(left), frac = S.total ? left / (S.total * 1000) : 0;
  $("#time").textContent = $("#miniTime").textContent = txt;
  $("#time").classList.toggle("done", finished);
  $("#miniTime").classList.toggle("done", finished);
  $("#bar").style.strokeDashoffset = C * (1 - frac);
  $("#miniBar").style.width = (frac * 100) + "%";
  $("#play").textContent = finished ? "알람 끄기" : running() ? "일시정지" : (left < S.total * 1000 ? "계속" : "시작");
  $("#miniPlay").textContent = finished ? "■" : running() ? "❚❚" : "▶";
  document.title = running() ? `${txt} · 타이머` : "타이머";
  send("badge", { text: running() ? txt.replace(/^0/, "") : (finished ? "!" : null) });
  return left;
}

function tick() {
  const left = render();
  if (left <= 0) return done();
  const sec = Math.ceil(left / 1000);
  if (S.tick && sec <= 5 && sec !== lastTickSec) { lastTickSec = sec; playTick(sec === 1); }
}

function start() {
  if (remaining <= 0) remaining = S.total * 1000;
  if (remaining <= 0) return;
  finished = false; lastTickSec = null; audio();
  endAt = Date.now() + remaining;
  send("alarm", { at: endAt });
  send("busy", { on: true });
  ticker = setInterval(tick, 250);
  render();
}
function pause() {
  if (!running()) return;
  remaining = Math.max(0, endAt - Date.now());
  endAt = null; clearInterval(ticker);
  send("alarm", { at: null }); send("busy", { on: false });
  render();
}
function done() {
  if (!running()) return;
  endAt = null; clearInterval(ticker); remaining = 0; finished = true;
  send("alarm", { at: null }); send("busy", { on: false });
  if (S.sound === "beep") startBeep(S.loop); else send("play", { name: S.sound, loop: S.loop });
  send("finish");
  render();
}
function stopAlarm() { finished = false; stopBeep(); send("stopSound"); remaining = S.total * 1000; render(); }
function reset() { pause(); stopAlarm(); }
function toggle() { finished ? stopAlarm() : running() ? pause() : start(); }
function setTotal(sec) {
  sec = Math.max(1, Math.min(sec, 999 * 60 + 59));
  pause(); finished = false; stopBeep(); send("stopSound");
  S.total = sec; remaining = sec * 1000; save();
  $("#mm").value = Math.floor(sec / 60); $("#ss").value = sec % 60;
  render();
}
window.__nativeAlarm = () => done();   // 창이 가려져 있어도 정확한 시각에 끝내요

// 고정(항상 위에)
function applyPin() {
  $("#pin").setAttribute("aria-pressed", String(S.onTop));
  $("#miniPin").setAttribute("aria-pressed", String(S.onTop));
  send("onTop", { on: S.onTop });
}
$("#pin").onclick = $("#miniPin").onclick = () => { S.onTop = !S.onTop; save(); applyPin(); };

// 간소화 창
$("#shrink").onclick = () => { document.body.classList.add("compact"); send("compact", { on: true }); };
$("#grow").onclick = () => { document.body.classList.remove("compact"); send("compact", { on: false }); };

PRESETS.forEach(m => {
  const b = document.createElement("button");
  b.textContent = m >= 60 ? `${m / 60}시간` : `${m}분`;
  b.onclick = () => setTotal(m * 60);
  $("#presets").appendChild(b);
});
const fromInputs = () => setTotal((parseInt($("#mm").value) || 0) * 60 + (parseInt($("#ss").value) || 0));
$("#mm").onchange = $("#ss").onchange = fromInputs;

$("#sound").add(new Option("삐비비비", "beep"));
SOUNDS.forEach(n => $("#sound").add(new Option(n, n)));
$("#sound").value = S.sound;
$("#sound").onchange = e => { S.sound = e.target.value; save(); S.sound === "beep" ? beepOnce() : send("play", { name: S.sound, loop: false }); };
$("#tick").checked = S.tick;
$("#tick").onchange = e => { S.tick = e.target.checked; save(); if (S.tick) playTick(false); };
$("#loop").checked = S.loop;
$("#loop").onchange = e => { S.loop = e.target.checked; save(); };

$("#play").onclick = $("#miniPlay").onclick = toggle;
$("#reset").onclick = reset;
document.addEventListener("keydown", e => {
  if (/INPUT|SELECT/.test(document.activeElement.tagName)) return;
  if (e.code === "Space") { e.preventDefault(); toggle(); }
  if (e.key === "r" || e.key === "R") reset();
});

$("#bar").style.strokeDasharray = C;
$("#mm").value = Math.floor(S.total / 60); $("#ss").value = S.total % 60;
applyPin();
render();
</script>
</body>
</html>
