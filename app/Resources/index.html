<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>타이머</title>
<style>
  :root { --fg:#f5f5f7; --dim:rgba(245,245,247,.55); --line:rgba(255,255,255,.14); --pin:#e0262c; --glass:rgba(255,255,255,.08); }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:transparent; color:var(--fg); font:13px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif; user-select:none; -webkit-user-select:none; overflow:hidden; }
  button { font:inherit; color:inherit; border:0; background:var(--glass); border-radius:8px; cursor:pointer; }
  button:hover { background:rgba(255,255,255,.15); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--pin); outline-offset:1px; }
  .app { height:100%; padding:26px 14px 12px; display:flex; flex-direction:column; gap:8px; }
  .top { display:flex; align-items:center; justify-content:space-between; }
  .time { font-size:50px; line-height:1; font-weight:300; font-variant-numeric:tabular-nums; letter-spacing:-1px; }
  .time.done { color:var(--pin); animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.35; } }
  .btns { display:flex; gap:6px; }
  .tool { width:34px; height:34px; display:grid; place-items:center; }
  .tool svg { width:16px; height:16px; }
  .tool[aria-pressed="true"] { background:var(--pin); color:#fff; }
  .play { background:var(--pin) !important; color:#fff; width:42px; }
  .bar { height:3px; border-radius:2px; background:var(--line); overflow:hidden; }
  .bar i { display:block; height:100%; width:100%; background:var(--pin); transition:width .3s linear; }
  .row { display:flex; align-items:center; gap:5px; color:var(--dim); }
  .row button { padding:4px 8px; color:var(--fg); }
  .row input { width:40px; padding:3px 4px; border-radius:6px; border:1px solid var(--line); background:var(--glass); color:var(--fg); font:inherit; text-align:center; font-variant-numeric:tabular-nums; }
  .row select { background:var(--glass); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:2px 4px; font:inherit; }
  .sp { flex:1; }
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <div class="time" id="time">25:00</div>
    <div class="btns">
      <button class="tool" id="reset" title="초기화 (R)" aria-label="초기화">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>
      </button>
      <button class="tool play" id="play" title="시작/일시정지 (스페이스)" aria-label="시작"></button>
      <button class="tool" id="pin" title="항상 위에 고정" aria-label="항상 위에 고정" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M9 3h6l-1 6 4 4H6l4-4z"/></svg>
      </button>
    </div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="row" id="presets"></div>
  <div class="row">
    <input id="mm" type="number" min="0" max="999" aria-label="분">분
    <input id="ss" type="number" min="0" max="59" aria-label="초">초
    <span class="sp"></span>
    <select id="sound" aria-label="알람 소리"></select>
    <label title="끌 때까지 울리기"><input type="checkbox" id="loop" style="width:auto"> 반복</label>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const send = (type, extra = {}) => { try { window.webkit.messageHandlers.tm.postMessage({ type, ...extra }); } catch (e) {} };
const SOUNDS = ["Glass","Hero","Ping","Purr","Submarine","Funk","Blow","Bottle","Frog","Morse","Pop","Sosumi","Tink","Basso"];
const PRESETS = [5, 10, 15, 25, 30, 50, 60];
const ICON = {
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg>',
};

let saved = {};
try { saved = JSON.parse(localStorage.getItem("timer") || "{}"); } catch (e) {}
const S = Object.assign({ total: 1500, onTop: false, sound: "Glass", loop: false }, saved);
let remaining = S.total * 1000, endAt = null, ticker = null, finished = false, lastIcon = "";
const save = () => { try { localStorage.setItem("timer", JSON.stringify(S)); } catch (e) {} };

const fmt = ms => {
  const t = Math.ceil(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  const p = n => String(n).padStart(2, "0");
  return h ? `${h}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
};
const running = () => endAt !== null;

function render() {
  const left = running() ? Math.max(0, endAt - Date.now()) : remaining;
  const txt = fmt(left);
  $("#time").textContent = txt;
  $("#time").classList.toggle("done", finished);
  $("#bar").style.width = (S.total ? left / (S.total * 1000) * 100 : 0) + "%";
  const icon = finished ? "stop" : running() ? "pause" : "play";
  if (icon !== lastIcon) {
    $("#play").innerHTML = ICON[icon]; lastIcon = icon;
    $("#play").setAttribute("aria-label", { stop: "알람 끄기", pause: "일시정지", play: "시작" }[icon]);
  }
  send("badge", { text: running() ? txt.replace(/^0/, "") : (finished ? "!" : null) });
  return left;
}

function start() {
  if (remaining <= 0) remaining = S.total * 1000;
  finished = false;
  endAt = Date.now() + remaining;
  send("alarm", { at: endAt }); send("busy", { on: true });
  ticker = setInterval(() => { if (render() <= 0) done(); }, 250);
  render();
}
function pause() {
  if (!running()) return;
  remaining = Math.max(0, endAt - Date.now());
  endAt = null; clearInterval(ticker);
  send("alarm", { at: null }); send("busy", { on: false });
  render();
}
function done() {
  if (!running()) return;
  endAt = null; clearInterval(ticker); remaining = 0; finished = true;
  send("alarm", { at: null }); send("busy", { on: false });
  send("play", { name: S.sound, loop: S.loop });
  send("finish");
  render();
}
function stopAlarm() { finished = false; send("stopSound"); remaining = S.total * 1000; render(); }
function reset() { pause(); stopAlarm(); }
function toggle() { finished ? stopAlarm() : running() ? pause() : start(); }
function setTotal(sec) {
  sec = Math.max(1, Math.min(sec, 999 * 60 + 59));
  pause(); finished = false; send("stopSound");
  S.total = sec; remaining = sec * 1000; save();
  $("#mm").value = Math.floor(sec / 60); $("#ss").value = sec % 60;
  render();
}
window.__nativeAlarm = () => done();   // 창이 가려져 있어도 정확한 시각에 끝내요

function applyPin() {
  $("#pin").setAttribute("aria-pressed", String(S.onTop));
  send("onTop", { on: S.onTop });
}
$("#pin").onclick = () => { S.onTop = !S.onTop; save(); applyPin(); };

PRESETS.forEach(m => {
  const b = document.createElement("button");
  b.textContent = m >= 60 ? "1시간" : `${m}분`;
  b.onclick = () => setTotal(m * 60);
  $("#presets").appendChild(b);
});
$("#mm").onchange = $("#ss").onchange = () => setTotal((parseInt($("#mm").value) || 0) * 60 + (parseInt($("#ss").value) || 0));

SOUNDS.forEach(n => $("#sound").add(new Option(n, n)));
$("#sound").value = S.sound;
$("#sound").onchange = e => { S.sound = e.target.value; save(); send("play", { name: S.sound, loop: false }); };
$("#loop").checked = S.loop;
$("#loop").onchange = e => { S.loop = e.target.checked; save(); };

$("#play").onclick = toggle;
$("#reset").onclick = reset;
document.addEventListener("keydown", e => {
  if (/INPUT|SELECT/.test(document.activeElement.tagName)) return;
  if (e.code === "Space") { e.preventDefault(); toggle(); }
  if (e.key === "r" || e.key === "R") reset();
});

$("#mm").value = Math.floor(S.total / 60); $("#ss").value = S.total % 60;
applyPin();
render();
</script>
</body>
</html>
