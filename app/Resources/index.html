<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>타이머</title>
<style>
  :root { --bg:transparent; --fg:#f5f5f7; --dim:rgba(245,245,247,.6); --soft:rgba(255,255,255,.1); --line:rgba(255,255,255,.16); --accent:#e0262c; }
  body.light { --fg:#1d1d1f; --dim:rgba(29,29,31,.6); --soft:rgba(0,0,0,.07); --line:rgba(0,0,0,.14); }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; overflow:hidden; }
  body { background:var(--bg); color:var(--fg); font:14px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif; user-select:none; -webkit-user-select:none; transition:background .25s, color .25s; }
  button { font:inherit; color:inherit; border:0; background:var(--soft); cursor:pointer; }
  button:hover { filter:brightness(1.15); }
  button:active { transform:scale(.96); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  .tools { position:fixed; top:8px; right:10px; display:flex; gap:6px; z-index:5; }
  .tool { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; }
  .tool svg { width:16px; height:16px; }
  .tool[aria-pressed="true"] { background:var(--accent); color:#fff; }

  .app { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:30px 20px 20px; }
  .clock { display:flex; align-items:center; gap:14px; }
  .adj { width:44px; height:44px; border-radius:50%; font-size:24px; line-height:1; display:grid; place-items:center; }
  .adj:disabled { opacity:.3; cursor:default; transform:none; filter:none; }
  .time { min-width:5ch; text-align:center; font-size:72px; font-weight:600; letter-spacing:-2px; font-variant-numeric:tabular-nums; line-height:1; }
  #time { cursor:text; border-radius:12px; padding:0 6px; }
  #time:hover { background:var(--soft); }
  .time.edit { width:5.2ch; padding:0 6px; border:0; border-radius:12px; background:var(--soft); color:var(--fg); font-family:inherit; outline:2px solid var(--accent); }
  .time.edit[hidden] { display:none; }
  .time.warn { color:var(--accent); }
  .time.done { color:var(--accent); animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.3; } }
  .bar { width:min(100%,300px); height:4px; border-radius:2px; background:var(--soft); overflow:hidden; }
  .bar i { display:block; height:100%; width:100%; background:var(--accent); transition:width .3s linear; }
  .ctrl { display:flex; gap:10px; }
  .ctrl button { height:44px; padding:0 22px; border-radius:999px; font-weight:600; }
  .play { background:var(--accent) !important; color:#fff; min-width:110px; }

  /* 설정 */
  .sheet { position:fixed; top:44px; right:10px; width:230px; padding:14px; border-radius:14px; background:rgba(30,30,32,.96); color:#f5f5f7; box-shadow:0 10px 30px rgba(0,0,0,.35); display:flex; flex-direction:column; gap:12px; z-index:6; }
  .sheet[hidden] { display:none; }
  .sheet h3 { font-size:12px; font-weight:600; color:rgba(245,245,247,.6); }
  .swatches { display:flex; flex-wrap:wrap; gap:7px; }
  .sw { width:26px; height:26px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(255,255,255,.25); }
  .sw[aria-pressed="true"] { box-shadow:0 0 0 2px #fff; }
  .sw.glass { background:linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,.05)); }
  .sw input { width:100%; height:100%; opacity:0; cursor:pointer; }
  .sw.custom { background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red); }
  .sheet label { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .files { display:grid; grid-template-columns:1fr auto auto; gap:6px; align-items:center; }
  .files button { background:rgba(255,255,255,.1); color:#f5f5f7; border-radius:7px; padding:3px 8px; font-size:12px; }
  .note { font-size:11px; color:rgba(245,245,247,.6); }
  .note:empty { display:none; }
  .sheet select { background:rgba(255,255,255,.1); color:#f5f5f7; border:1px solid rgba(255,255,255,.16); border-radius:7px; padding:3px 6px; font:inherit; }

  /* 간소화 창 */
  .mini { display:none; height:100%; align-items:center; justify-content:space-between; padding:14px 16px 0; gap:10px; }
  .mini .time { font-size:44px; min-width:0; text-align:left; }
  .mini-btns { display:flex; gap:6px; }
  body.compact .app, body.compact .tools, body.compact .sheet { display:none; }
  body.compact .mini { display:flex; }
  .mini-bar { position:fixed; left:0; bottom:0; height:3px; background:var(--accent); transition:width .3s linear; }
</style>
</head>
<body>
<div class="tools">
  <button class="tool" id="gear" title="설정" aria-label="설정" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
  <button class="tool" id="pin" title="항상 위에 고정" aria-label="항상 위에 고정" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M9 3h6l-1 6 4 4H6l4-4z"/></svg>
  </button>
  <button class="tool" id="shrink" title="작게 보기" aria-label="작게 보기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg>
  </button>
</div>

<div class="sheet" id="sheet" hidden>
  <h3>배경색</h3>
  <div class="swatches" id="swatches"></div>
  <h3>소리</h3>
  <label>끝날 때 <select id="sound"></select></label>
  <label>마지막 5초 똑딱 <input type="checkbox" id="tick"></label>
  <label>끌 때까지 울리기 <input type="checkbox" id="loop"></label>
  <h3>내 소리 파일 (mp3·wav·m4a)</h3>
  <div class="files">
    <span>똑딱</span><button id="tickPick">고르기</button><button id="tickClear" aria-label="똑딱 파일 지우기">기본</button>
    <span>끝</span><button id="endPick">고르기</button><button id="endClear" aria-label="끝 소리 파일 지우기">기본</button>
  </div>
  <input type="file" id="filePick" accept="audio/*" hidden>
  <p class="note" id="fileNote"></p>
</div>

<main class="app">
  <div class="clock">
    <button class="adj" id="minus" title="1분 빼기" aria-label="1분 빼기">−</button>
    <div class="time" id="time" tabindex="0" role="button" title="눌러서 시간 입력" aria-label="시간 입력">05:00</div>
    <input class="time edit" id="timeEdit" inputmode="numeric" aria-label="시간 입력 (분:초)" hidden>
    <button class="adj" id="plus" title="1분 더하기" aria-label="1분 더하기">+</button>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="ctrl">
    <button id="reset">초기화</button>
    <button id="play" class="play">시작</button>
  </div>
</main>

<div class="mini">
  <div class="time" id="miniTime">05:00</div>
  <div class="mini-btns">
    <button class="tool" id="miniPlay" aria-label="시작/일시정지">▶</button>
    <button class="tool" id="miniPin" aria-label="항상 위에 고정" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M9 3h6l-1 6 4 4H6l4-4z"/></svg>
    </button>
    <button class="tool" id="grow" aria-label="크게 보기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
    </button>
  </div>
  <i class="mini-bar" id="miniBar"></i>
</div>

<script>
const $ = s => document.querySelector(s);
const send = (type, extra = {}) => { try { window.webkit.messageHandlers.tm.postMessage({ type, ...extra }); } catch (e) {} };
const SYS = ["Glass","Hero","Ping","Purr","Submarine","Funk","Blow","Bottle","Frog","Pop","Tink"];
const COLORS = ["glass", "#1d1d1f", "#ffffff", "#ffc943", "#ff8577", "#ffa3e5", "#9747ff", "#5eb5ff", "#66d575"];

let saved = {};
try { saved = JSON.parse(localStorage.getItem("timer2") || "{}"); } catch (e) {}
const S = Object.assign({ total: 300, onTop: false, sound: "rattle", loop: false, tick: true, bg: "glass" }, saved);
if (!saved.v2) { S.sound = "rattle"; S.v2 = true; }
const save = () => { try { localStorage.setItem("timer2", JSON.stringify(S)); } catch (e) {} };
let remaining = S.total * 1000, endAt = null, ticker = null, finished = false, lastTickSec = null;

// ───── 소리 (직접 합성) ─────
let ac = null;
const audio = () => { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); return ac; };
function tone(freq, at, dur, vol, type = "sine") {
  const c = audio(), o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, at);
  g.gain.linearRampToValueAtTime(vol, at + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(c.destination);
  o.start(at); o.stop(at + dur + 0.05);
}
// 짧은 "딱" 소리: 걸러낸 잡음으로 시계/나무 느낌
function click(at, freq, vol) {
  const c = audio(), len = Math.floor(c.sampleRate * 0.03), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 6);
  const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 8; g.gain.value = vol;
  src.connect(f).connect(g).connect(c.destination); src.start(at);
}
// 마림바 한 음
function mallet(freq, at, vol) {
  tone(freq, at, 0.9, vol, "sine");
  tone(freq * 4, at, 0.12, vol * 0.35, "sine");
  tone(freq * 10, at, 0.03, vol * 0.1, "sine");
}
// 나무 블록 한 번 (짧은 딱 + 짧은 울림)
function wood(at, freq, vol) {
  click(at, freq * 2.2, vol * 2.2);
  tone(freq, at, 0.06, vol * 0.5, "sine");
}
// 마지막 5초: 1초마다 "똑딱"
function synthTick(sec) {
  const t = audio().currentTime;
  wood(t, 1300, 0.9);          // 똑
  wood(t + 0.16, 950, 0.8);    // 딱
}
// 0초: "뜨드뜨드든"
function rattle() {
  const t = audio().currentTime;
  [0, 0.07, 0.14, 0.21].forEach((d, i) => wood(t + d, i % 2 ? 620 : 760, 0.9));   // 뜨드뜨드
  wood(t + 0.30, 440, 1.1);                                                        // 든
  tone(220, t + 0.30, 0.35, 0.25, "sine");
}
// 끝: 마림바 "딩-딩-딩-딩~"
function chime() {
  const t = audio().currentTime;
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => mallet(f, t + i * 0.14, 0.32));
  mallet(1046.5, t + 0.56, 0.2); mallet(1318.5, t + 0.56, 0.18);
}
function beeps() { const t = audio().currentTime; for (let i = 0; i < 4; i++) tone(2000, t + i * 0.13, 0.09, 0.2, "square"); }

// 내 소리 파일 (설정에서 넣어요)
const custom = { tick: null, end: null };
async function loadCustom(kind, dataUrl) {
  if (!dataUrl) { custom[kind] = null; return; }
  try { custom[kind] = await audio().decodeAudioData(await (await fetch(dataUrl)).arrayBuffer()); } catch (e) { custom[kind] = null; }
}
function playBuf(buf) { const c = audio(), src = c.createBufferSource(); src.buffer = buf; src.connect(c.destination); src.start(); return buf.duration; }
function playTick(sec) { custom.tick ? playBuf(custom.tick) : synthTick(sec); }
const SOUNDS = {
  rattle: ["뜨드뜨드든", rattle, 1200],
  chime: ["마림바", chime, 2000],
  beep: ["삐비비비", beeps, 1000],
  file: ["내 소리 파일", () => { if (custom.end) playBuf(custom.end); }, 0],
};
let alarmTimer = null;
function startAlarm() {
  stopAlarmSound();
  const snd = SOUNDS[S.sound === "file" && !custom.end ? "rattle" : S.sound];
  if (!snd) return send("play", { name: S.sound, loop: S.loop });
  snd[1](); let n = 1;
  const gap = S.sound === "file" ? Math.max(1000, (custom.end ? custom.end.duration : 1) * 1000 + 400) : snd[2];
  alarmTimer = setInterval(() => { if (!S.loop && n >= (S.sound === "rattle" ? 1 : 2)) return stopAlarmSound(); snd[1](); n++; }, gap);
}
function stopAlarmSound() { clearInterval(alarmTimer); alarmTimer = null; send("stopSound"); }

// ───── 타이머 ─────
const fmt = ms => {
  const t = Math.ceil(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  const p = n => String(n).padStart(2, "0");
  return h ? `${h}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
};
const running = () => endAt !== null;
const leftMs = () => running() ? Math.max(0, endAt - Date.now()) : remaining;

function render() {
  const left = leftMs(), txt = fmt(left), frac = S.total ? Math.min(1, left / (S.total * 1000)) : 0;
  for (const el of [$("#time"), $("#miniTime")]) {
    el.textContent = txt;
    el.classList.toggle("done", finished);
    el.classList.toggle("warn", running() && left <= 5000);
  }
  $("#bar").style.width = $("#miniBar").style.width = (frac * 100) + "%";
  const fresh = !running() && left === S.total * 1000;
  $("#play").textContent = finished ? "알람 끄기" : running() ? "일시정지" : fresh ? "시작" : "계속";
  $("#miniPlay").textContent = finished ? "■" : running() ? "❚❚" : "▶";
  // 돌아가는 동안: −는 끄고 +는 "1분 더"
  $("#minus").disabled = running() || finished || S.total <= 60;
  $("#minus").disabled = $("#minus").disabled || remaining <= 60000 && !running();
  $("#plus").title = running() ? "1분 더" : "1분 더하기";
  send("badge", { text: running() ? txt.replace(/^0/, "") : (finished ? "!" : null) });
  return left;
}
function tick() {
  const left = render();
  if (left <= 0) return done();
  const sec = Math.ceil(left / 1000);
  if (S.tick && sec <= 5 && sec !== lastTickSec) { lastTickSec = sec; playTick(sec); }
}
function start() {
  if (remaining <= 0) remaining = S.total * 1000;
  finished = false; lastTickSec = null; audio();
  endAt = Date.now() + remaining;
  send("alarm", { at: endAt }); send("busy", { on: true });
  ticker = setInterval(tick, 200);
  render();
}
function pause() {
  if (!running()) return;
  remaining = leftMs(); endAt = null; clearInterval(ticker);
  send("alarm", { at: null }); send("busy", { on: false });
  render();
}
function done() {
  if (!running()) return;
  endAt = null; clearInterval(ticker); remaining = 0; finished = true;
  send("alarm", { at: null }); send("busy", { on: false });
  startAlarm(); send("finish");
  render();
}
function stopAlarm() { finished = false; stopAlarmSound(); remaining = S.total * 1000; render(); }
function reset() { pause(); stopAlarm(); }
function toggle() { finished ? stopAlarm() : running() ? pause() : start(); }
function adjust(min) {
  if (running()) {                       // 도는 중엔 1분 더하기만
    endAt += 60000; S.total += 60; lastTickSec = null;
    send("alarm", { at: endAt });
  } else {
    if (finished) { finished = false; stopAlarmSound(); }
    S.total = Math.max(60, Math.min(S.total + min * 60, 999 * 60)); remaining = S.total * 1000;
  }
  save(); render();
}
window.__nativeAlarm = () => done();   // 창이 가려져 있어도 정확한 시각에 끝내요

// 숫자를 눌러 키보드로 입력: "7" → 7분, "130" → 1:30, "10:30" → 10분 30초
function parseTime(v) {
  v = v.trim();
  if (!v) return null;
  if (v.includes(":")) {
    const [m, sec] = v.split(":").map(x => parseInt(x || "0", 10));
    return isNaN(m) || isNaN(sec) ? null : m * 60 + sec;
  }
  if (!/^\d+$/.test(v)) return null;
  if (v.length <= 2) return parseInt(v, 10) * 60;           // 분만
  return parseInt(v.slice(0, -2), 10) * 60 + parseInt(v.slice(-2), 10);   // 앞은 분, 뒤 두 자리는 초
}
function openEdit() {
  if (running()) pause();
  if (finished) stopAlarm();
  const ed = $("#timeEdit");
  ed.value = fmt(remaining); ed.hidden = false; $("#time").hidden = true;
  ed.focus(); ed.select();
}
function closeEdit(apply) {
  const ed = $("#timeEdit");
  if (ed.hidden) return;
  if (apply) {
    const sec = parseTime(ed.value);
    if (sec !== null && sec > 0) { S.total = Math.min(sec, 999 * 60 + 59); remaining = S.total * 1000; save(); }
  }
  ed.hidden = true; $("#time").hidden = false; render();
}
$("#time").onclick = openEdit;
$("#time").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); openEdit(); } };
$("#timeEdit").onkeydown = e => {
  if (e.key === "Enter") { e.preventDefault(); closeEdit(true); }
  else if (e.key === "Escape") { e.preventDefault(); closeEdit(false); }
  else if (!/^[0-9:]$/.test(e.key) && e.key.length === 1 && !e.metaKey) e.preventDefault();   // 숫자와 : 만
};
$("#timeEdit").onblur = () => closeEdit(true);

$("#minus").onclick = () => adjust(-1);
$("#plus").onclick = () => adjust(1);
$("#play").onclick = $("#miniPlay").onclick = toggle;
$("#reset").onclick = reset;

// ───── 고정 / 작게 보기 ─────
function applyPin() {
  $("#pin").setAttribute("aria-pressed", String(S.onTop));
  $("#miniPin").setAttribute("aria-pressed", String(S.onTop));
  send("onTop", { on: S.onTop });
}
$("#pin").onclick = $("#miniPin").onclick = () => { S.onTop = !S.onTop; save(); applyPin(); };
$("#shrink").onclick = () => { closeSheet(); document.body.classList.add("compact"); send("compact", { on: true }); };
$("#grow").onclick = () => { document.body.classList.remove("compact"); send("compact", { on: false }); };

// ───── 설정 ─────
const closeSheet = () => { $("#sheet").hidden = true; $("#gear").setAttribute("aria-expanded", "false"); };
$("#gear").onclick = e => { e.stopPropagation(); const open = $("#sheet").hidden; $("#sheet").hidden = !open; $("#gear").setAttribute("aria-expanded", String(open)); };
$("#sheet").onclick = e => e.stopPropagation();
document.addEventListener("click", closeSheet);

function isLight(hex) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = n >> 8 & 255, b = n & 255;
  return (r * 299 + g * 587 + b * 114) / 1000 > 150;
}
function applyBg() {
  const glass = S.bg === "glass";
  document.body.style.setProperty("--bg", glass ? "transparent" : S.bg);
  document.body.classList.toggle("light", !glass && isLight(S.bg));
  document.querySelectorAll(".sw").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.c === S.bg || (b.classList.contains("custom") && !COLORS.includes(S.bg)))));
}
COLORS.forEach(c => {
  const b = document.createElement("button");
  b.className = "sw" + (c === "glass" ? " glass" : ""); b.dataset.c = c;
  if (c !== "glass") b.style.background = c;
  b.setAttribute("aria-label", c === "glass" ? "기본(유리)" : `배경 ${c}`);
  b.onclick = () => { S.bg = c; save(); applyBg(); };
  $("#swatches").appendChild(b);
});
const pickSw = document.createElement("span");
pickSw.className = "sw custom"; pickSw.title = "직접 고르기";
pickSw.innerHTML = '<input type="color" aria-label="배경색 직접 고르기">';
pickSw.querySelector("input").oninput = e => { S.bg = e.target.value; save(); applyBg(); };
$("#swatches").appendChild(pickSw);

Object.entries(SOUNDS).forEach(([k, v]) => $("#sound").add(new Option(v[0], k)));
SYS.forEach(n => $("#sound").add(new Option(n, n)));
$("#sound").value = S.sound;
$("#sound").onchange = e => { S.sound = e.target.value; save(); SOUNDS[S.sound] ? SOUNDS[S.sound][1]() : send("play", { name: S.sound, loop: false }); };
$("#tick").checked = S.tick;
$("#tick").onchange = e => { S.tick = e.target.checked; save(); if (S.tick) playTick(3); };
$("#loop").checked = S.loop;
$("#loop").onchange = e => { S.loop = e.target.checked; save(); };

// 소리 파일 넣기: 브라우저 저장소에 보관해서 다음에 켜도 남아 있어요
let pickKind = null;
const fileKey = k => "timer_snd_" + k;
function fileLabel() {
  const names = [];
  try { if (localStorage.getItem(fileKey("tick"))) names.push("똑딱"); if (localStorage.getItem(fileKey("end"))) names.push("끝"); } catch (e) {}
  $("#fileNote").textContent = names.length ? `사용 중: ${names.join(", ")} 소리 파일` : "";
}
$("#tickPick").onclick = () => { pickKind = "tick"; $("#filePick").click(); };
$("#endPick").onclick = () => { pickKind = "end"; $("#filePick").click(); };
$("#filePick").onchange = e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  if (f.size > 3 * 1024 * 1024) { $("#fileNote").textContent = "3MB 이하 파일만 넣을 수 있어요."; return; }
  const kind = pickKind, rd = new FileReader();
  rd.onload = async () => {
    try { localStorage.setItem(fileKey(kind), rd.result); } catch (err) { $("#fileNote").textContent = "파일이 너무 커서 저장하지 못했어요."; return; }
    await loadCustom(kind, rd.result);
    if (!custom[kind]) { $("#fileNote").textContent = "이 파일은 재생할 수 없어요."; return; }
    if (kind === "end") { S.sound = "file"; $("#sound").value = "file"; save(); }
    playBuf(custom[kind]); fileLabel();
  };
  rd.readAsDataURL(f);
};
function clearFile(kind) {
  try { localStorage.removeItem(fileKey(kind)); } catch (e) {}
  custom[kind] = null;
  if (kind === "end" && S.sound === "file") { S.sound = "rattle"; $("#sound").value = "rattle"; save(); }
  fileLabel();
}
$("#tickClear").onclick = () => clearFile("tick");
$("#endClear").onclick = () => clearFile("end");
["tick", "end"].forEach(k => { let v = null; try { v = localStorage.getItem(fileKey(k)); } catch (e) {} if (v) loadCustom(k, v); });
fileLabel();

document.addEventListener("keydown", e => {
  if (/INPUT|SELECT/.test(document.activeElement.tagName)) return;
  if (e.code === "Space") { e.preventDefault(); toggle(); }
  else if (e.key === "r" || e.key === "R") reset();
  else if (e.key === "ArrowUp" || e.key === "+" || e.key === "=") adjust(1);
  else if (e.key === "ArrowDown" || e.key === "-") { if (!running()) adjust(-1); }
});

applyPin(); applyBg(); render();
</script>
</body>
</html>
